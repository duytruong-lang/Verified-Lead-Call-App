project_id = "verified-lead-call-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = false

[auth.email]
# Keep this aligned with TEAM_LINK_TTL_SECONDS used by team-admin.
otp_expiry = 3600

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.call-api]
verify_jwt = true

[functions.public-recording]
verify_jwt = false

[functions.sheets-admin]
verify_jwt = true

[functions.sheets-worker]
verify_jwt = true

[functions.team-admin]
verify_jwt = true
